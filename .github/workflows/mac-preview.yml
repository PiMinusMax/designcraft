# LOCAL ONLY (fork): an unsigned macOS build of the local preview branch, for testing.
name: macOS preview build
on:
  push:
    branches: [local-preview-mac]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      DESIGNCRAFT_VERSION: "0.13.0+local.202610262159.4dbb211b.trace"
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build (ad-hoc signed, not notarized)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: designcraft-macos-preview
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
